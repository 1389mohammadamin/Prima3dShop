{% extends "base.html" %}
{% block title %}مدیریت اعلان - پیریما Shop 3D{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <h1 class="text-2xl font-bold mb-6">مدیریت اعلان سراسری</h1>
        <form method="POST">    
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">متن اعلان</label>
                <input type="text" name="announcement" value="{{ announcement or '' }}" 
                       placeholder="مثال: تخفیف ویژه تا پایان هفته..."
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">صفحه نمایش (اختیاری)</label>
                <select name="announcement_page" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">همه صفحات</option>
                    <option value="home">فقط صفحه اصلی</option>
                    <option value="products">فقط صفحه محصولات</option>
                    <option value="product">فقط صفحه جزئیات محصول</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">لینک (اختیاری)</label>
                <input type="text" name="announcement_link" value="{{ announcement_link or '' }}" 
                       placeholder="مثال: /products"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition shadow-sm">
                    <i class="fas fa-save ml-2"></i> ذخیره
                </button>
                <a href="/admin" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                    <i class="fas fa-times ml-2"></i> انصراف
                </a>
            </div>
            {% if announcement %}
            <div class="mt-6 p-4 bg-green-50 rounded-lg border border-green-200">
                <p class="text-sm text-green-800">
                    <i class="fas fa-check-circle ml-2"></i>
                    اعلان فعلی: <strong>{{ announcement }}</strong>
                    {% if announcement_link %}
                    <br>لینک: <a href="{{ announcement_link }}" class="text-blue-600 hover:underline">{{ announcement_link }}</a>
                    {% endif %}
                </p>
            </div>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
