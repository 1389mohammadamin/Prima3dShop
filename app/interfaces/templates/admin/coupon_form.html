{% extends "base.html" %}

{% block title %}ایجاد کد تخفیف - پیریما Shop 3D{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6">ایجاد کد تخفیف جدید</h1>
        
        <form method="POST">    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">کد تخفیف *</label>
                <input type="text" name="code" placeholder="مثلاً SUMMER10" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">توضیحات</label>
                <input type="text" name="description" placeholder="تخفیف تابستانی"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">نوع تخفیف *</label>
                    <select name="discount_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="percent">درصدی</option>
                        <option value="fixed">مبلغ ثابت</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">مقدار تخفیف *</label>
                    <input type="number" name="discount_value" step="1" min="1" max="100" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">حداقل مبلغ سفارش</label>
                    <input type="number" name="min_order_amount" step="1" min="0" value="0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">حداکثر تخفیف (اختیاری)</label>
                    <input type="number" name="max_discount_amount" step="1" min="0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">تعداد دفعات استفاده</label>
                    <input type="number" name="usage_limit" min="1" max="100" value="1"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">تاریخ انقضا (اختیاری)</label>
                    <input type="date" name="expires_at"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="flex items-center">
                    <input type="checkbox" name="is_active" checked class="ml-2">
                    <span class="text-gray-700">فعال</span>
                </label>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700 transition">
                    <i class="fas fa-save ml-2"></i> ایجاد
                </button>
                <a href="/admin/coupons" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                    <i class="fas fa-times ml-2"></i> انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
