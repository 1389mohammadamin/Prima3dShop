{% extends "base.html" %}

{% block title %}خطای سرور - 500{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center">
        <div class="text-9xl font-bold text-gray-300">500</div>
        <div class="text-6xl mb-4">🔧</div>
        <h1 class="text-3xl font-bold text-gray-800 mb-4">خطای داخلی سرور!</h1>

        <div class="flex justify-center gap-4">

            </a>

                تلاش مجدد
