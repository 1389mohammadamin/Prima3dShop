{% extends "base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold text-center mb-6">ثبت‌نام</h2>
    <form method="POST">            
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">نام کاربری</label>
            <input type="text" name="username" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">ایمیل</label>
            <input type="email" name="email" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">رمز عبور</label>
            <input type="password" name="password" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">تکرار رمز عبور</label>
            <input type="password" name="confirm_password" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary-500">
        </div>
                    <div class="mb-4">
                <label class="flex items-start">
                    <input type="checkbox" name="accept_terms" required class="mt-1 ml-2">
                    <span class="text-sm text-gray-600">
                        <a href="/terms" target="_blank" class="text-blue-600 hover:underline">قوانین و مقررات</a>
                        و
                        <a href="/privacy" target="_blank" class="text-blue-600 hover:underline">حریم خصوصی</a>
                        را می‌پذیرم.
                    </span>
                </label>
            </div>
        <button type="submit" 
                class="w-full bg-primary-600 text-white px-6 py-3 rounded-lg hover:bg-primary-700 transition bg-blue-600">
            ثبت‌نام
        </button>
    </form>
    <p class="text-center text-gray-600 mt-4">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="/auth/login" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"">ورود</a>
    </p>
</div>
{% endblock %}
